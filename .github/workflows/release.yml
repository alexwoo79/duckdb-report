name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin/universal
            artifact: duckdb-report-macos-universal
          - os: windows-latest
            platform: windows/amd64
            artifact: duckdb-report-windows-amd64
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: duckdb-report-linux-amd64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    env:
      GOTOOLCHAIN: go1.26.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build macOS CLI
        if: runner.os == 'macOS'
        run: go build -trimpath -ldflags="-s -w" -o build/bin/duckdb-report-cli-amd64 ./cmd/duckdb-report-cli
      - name: Build Windows CLI
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-s -w" -o build/bin/duckdb-report-cli.exe ./cmd/duckdb-report-cli
      - name: Build Linux CLI
        if: runner.os == 'Linux'
        run: go build -trimpath -ldflags="-s -w" -o build/bin/duckdb-report-cli ./cmd/duckdb-report-cli
      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          CGO_LDFLAGS: -mmacosx-version-min=13.0
        run: wails build -platform darwin/universal -trimpath
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -trimpath
      - name: Build Linux app
        if: runner.os == 'Linux'
        run: wails build -platform linux/amd64 -tags webkit2_41 -trimpath
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/duckdb-report-macos-universal
          ditto build/bin/duckdb_report.app \
            dist/duckdb-report-macos-universal/duckdb_report.app
          cp build/bin/duckdb-report-cli-amd64 \
            dist/duckdb-report-macos-universal/duckdb-report-cli-amd64
          ditto -c -k --sequesterRsrc --keepParent \
            dist/duckdb-report-macos-universal \
            "dist/duckdb-report-${GITHUB_REF_NAME}-macos-universal.zip"
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/bin/* `
            -DestinationPath "dist/duckdb-report-$env:GITHUB_REF_NAME-windows-amd64.zip"
      - name: Package Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/duckdb-report-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
            -C build/bin duckdb_report duckdb-report-cli \
            -C "$GITHUB_WORKSPACE" LICENSE README.md docs/INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          mkdir -p release-artifacts
          cd release-artifacts
          sha256sum * > checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
          overwrite_files: true
