name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update a prerelease with the three platform ZIPs"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin/universal
            artifact: duckdb-report-macos-universal
          - os: windows-latest
            platform: windows/amd64
            artifact: duckdb-report-windows-amd64
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: duckdb-report-linux-amd64
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: go1.26.0
    steps:
      - uses: actions/checkout@v4
      - name: Checkout companion skill
        uses: actions/checkout@v4
        with:
          repository: alexwoo79/skills_plugins
          ref: 6515f28514b288a1218068605dcde2744ac75e49
          path: .skill-source
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Windows CLI
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-s -w" -o build/bin/duckdb-report-cli.exe ./cmd/duckdb-report-cli
      - name: Build Linux CLI
        if: runner.os == 'Linux'
        run: go build -trimpath -ldflags="-s -w" -o build/bin/duckdb-report-cli ./cmd/duckdb-report-cli
      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          CGO_LDFLAGS: -mmacosx-version-min=13.0
        run: wails build -platform darwin/universal -trimpath -ldflags="-s -w"
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -trimpath -ldflags="-s -w"
      - name: Build Linux app
        if: runner.os == 'Linux'
        run: wails build -platform linux/amd64 -tags webkit2_41 -trimpath -ldflags="-s -w"
      - name: Set package version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=snapshot-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stage="dist/stage/duckdb-report-macos-universal"
          mkdir -p "$stage/skill"
          ditto build/bin/duckdb_report.app \
            "$stage/duckdb_report.app"
          cp build/darwin/duckdb-report-cli "$stage/duckdb-report-cli"
          chmod +x "$stage/duckdb-report-cli"
          cp -R .skill-source/codex-skills/duckdb-sql-analytics "$stage/skill/"
          cp LICENSE README.md "$stage/"
          mkdir -p "$stage/docs"
          cp docs/INSTALL.md "$stage/docs/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$stage" \
            "dist/duckdb-report-${PACKAGE_VERSION}-macos-universal.zip"
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/stage/duckdb-report-windows-amd64"
          New-Item -ItemType Directory -Force -Path "$stage/skill", "$stage/docs" | Out-Null
          Copy-Item build/bin/* $stage -Recurse
          Copy-Item .skill-source/codex-skills/duckdb-sql-analytics `
            "$stage/skill/" -Recurse
          Copy-Item LICENSE, README.md $stage
          Copy-Item docs/INSTALL.md "$stage/docs/"
          Compress-Archive -Path $stage `
            -DestinationPath "dist/duckdb-report-$env:PACKAGE_VERSION-windows-amd64.zip"
      - name: Package Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          stage="dist/stage/duckdb-report-linux-amd64"
          mkdir -p "$stage/skill" "$stage/docs"
          cp build/bin/duckdb_report build/bin/duckdb-report-cli "$stage/"
          cp -R .skill-source/codex-skills/duckdb-sql-analytics "$stage/skill/"
          cp LICENSE README.md "$stage/"
          cp docs/INSTALL.md "$stage/docs/"
          (cd dist/stage && zip -qr "../duckdb-report-${PACKAGE_VERSION}-linux-amd64.zip" duckdb-report-linux-amd64)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Set release name
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=snapshot-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=DuckDB Report Studio snapshot ${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Create checksums
        run: |
          mkdir -p release-artifacts
          cd release-artifacts
          sha256sum * > checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: release-artifacts/*
          overwrite_files: true
